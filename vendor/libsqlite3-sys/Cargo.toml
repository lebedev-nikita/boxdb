[package]
edition = "2021"
name = "boxdb-sqlite-sys"
version = "0.3.2"
authors = ["The rusqlite developers"]
build = "build.rs"
links = "sqlite3"
exclude = ["**/*.sh"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "BoxDB SQLite engine and native bindings (fork of libsqlite3-sys 0.38.2)"
readme = "README.md"
keywords = [
    "sqlite",
    "sqlcipher",
    "ffi",
]
categories = ["external-ffi-bindings"]
license = "MIT"
repository = "https://github.com/lebedev-nikita/boxdb"

[features]
buildtime_bindgen = [
    "bindgen",
    "pkg-config",
    "vcpkg",
]
bundled = [
    "cc",
    "bundled_bindings",
]
bundled-sqlcipher = ["bundled"]
bundled-sqlcipher-vendored-openssl = [
    "bundled-sqlcipher",
    "openssl-sys/vendored",
]
bundled-windows = [
    "cc",
    "bundled_bindings",
]
bundled_bindings = []
column_metadata = []
default = ["bundled", "min_sqlite_version_3_34_1"]
in_gecko = []
loadable_extension = [
    "prettyplease",
    "quote",
    "syn",
]
min_sqlite_version_3_34_1 = [
    "pkg-config",
    "vcpkg",
]
preupdate_hook = ["buildtime_bindgen"]
session = [
    "preupdate_hook",
    "buildtime_bindgen",
]
sqlcipher = []
unlock_notify = []
wasm32-wasi-vfs = []
with-asan = []

[lib]
name = "libsqlite3_sys"
path = "src/lib.rs"

[dependencies.openssl-sys]
version = "0.9.103"
optional = true

[build-dependencies.bindgen]
version = "0.72"
features = ["runtime"]
optional = true
default-features = false

[build-dependencies.cc]
version = "1.2.27"
optional = true

[build-dependencies.pkg-config]
version = "0.3.19"
optional = true

[build-dependencies.prettyplease]
version = "0.2.20"
optional = true

[build-dependencies.quote]
version = "1.0.36"
optional = true
default-features = false

[build-dependencies.syn]
version = "2.0.89"
features = [
    "full",
    "extra-traits",
    "visit-mut",
]
optional = true

[build-dependencies.vcpkg]
version = "0.2.15"
optional = true

[dependencies.bigdecimal]
version = "0.4"

[dependencies.num-bigint]
version = "0.4"

[dependencies.num-integer]
version = "0.1"

[dependencies.num-traits]
version = "0.2"

[dependencies.uuid]
version = "1"

[dependencies.chrono]
version = "0.4"

[package.metadata.boxdb]
upstream-version = "0.38.2"
