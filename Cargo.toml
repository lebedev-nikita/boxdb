[package]
name = "boxdb"
version = "0.4.0"
edition = "2024"
description = "An extended SQLite client with typed columns and readable storage"
license = "MIT"
repository = "https://github.com/lebedev-nikita/boxdb"
readme = "README.md"
keywords = ["sqlite", "database", "yaml", "decimal"]
categories = ["database"]
include = [
    "/src/**",
    "/build.rs",
    "/vendor/sqlean/**",
    "/vendor/sqlite-recovery/**",
    "/tests/*.rs",
    "/tests/test_*.py",
    "/tests/common/**",
    "/tests/fixtures/**",
    "/tests/sqlite/**",
    "/benches/**",
    "/docs/**",
    "/tools/*.py",
    "/assets/**",
    "/README.md",
    "/LICENSE",
]

[workspace]
members = ["packages/typescript/native", "packages/go/native", "vendor/rusqlite", "vendor/libsqlite3-sys"]
default-members = ["."]
resolver = "3"

[dependencies]
sqlparser = "=0.53.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
thiserror = "2"
bigdecimal = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
rusqlite = { package = "boxdb-rusqlite", path = "vendor/rusqlite", version = "=0.4.0", features = ["bundled", "functions", "pointer", "backup", "column_metadata", "hooks", "preupdate_hook"] }
libsqlite3-sys = { package = "boxdb-sqlite-sys", path = "vendor/libsqlite3-sys", version = "=0.4.0", features = ["bundled"] }
sqlite-vec = "=0.1.9"

[build-dependencies]
cc = "1"

[[bench]]
name = "sqlite_vs_boxdb"
harness = false
