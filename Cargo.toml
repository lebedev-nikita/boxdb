[package]
name = "boxdb"
version = "0.1.0"
edition = "2024"
description = "A strict, typed embedded Rust database with diffable storage and S3 replication"
license = "MIT"
repository = "https://github.com/lebedev-nikita/boxdb"

[dependencies]
sqlparser = { version = "=0.53.0", features = ["serde", "visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bigdecimal = { version = "0.4", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
zstd = "0.13"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tempfile = "3"
