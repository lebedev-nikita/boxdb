name: npm packages

on:
  push:
    paths: ["packages/**", "scripts/npm/**", "src/**", "vendor/**", "build.rs", "Cargo.toml", "Cargo.lock", "package.json", "bun.lock", ".github/workflows/npm.yml"]
  pull_request:
    paths: ["packages/**", "scripts/npm/**", "src/**", "vendor/**", "build.rs", "Cargo.toml", "Cargo.lock", "package.json", "bun.lock", ".github/workflows/npm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: darwin-arm64
          - runner: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Install SQLite build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: bun install --frozen-lockfile
      - run: bun run npm:build
      - run: bun run npm:pack --local
      - run: bun run npm:check
      - run: bun run npm:test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-native-${{ matrix.platform }}
          path: target/npm-native/
          if-no-files-found: error

  assemble:
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: npm-native-*
          path: target/npm-native
          merge-multiple: true
      - run: bun install --frozen-lockfile
      - run: bun run npm:pack
      - name: Verify package checksums
        working-directory: target/npm
        run: sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boxdb-npm
          path: |
            target/npm/*.tgz
            target/npm/release.json
            target/npm/SHA256SUMS
          if-no-files-found: error

  verify:
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, macos-15]
        node: [22, 24]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: boxdb-npm
          path: target/npm
      - run: bun install --frozen-lockfile
      - run: bun run npm:test
