name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install SQLite binding build dependency
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: cargo fmt --all --check
      - run: rustfmt --edition 2024 --check benches/support/workload.rs
      - run: cargo clippy --no-deps --workspace --exclude boxdb-rusqlite --exclude boxdb-sqlite-sys --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Verify published Rust package contents and dependency chain
        run: cargo package --locked -p boxdb-sqlite-sys -p boxdb-rusqlite -p boxdb
      - name: Benchmark CLI and performance report contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Benchmark correctness smoke test
        run: >-
          cargo test --locked --bench sqlite_vs_boxdb --
          --rows 30 --samples 1 --reads 3 --batch-size 7 --writes 4
      - name: Typed benchmark correctness smoke test
        run: >-
          cargo test --locked --bench sqlite_vs_boxdb --
          --rows 30 --samples 1 --reads 3 --batch-size 7 --writes 4 --typed
      - name: YAML benchmark correctness smoke test
        run: >-
          cargo test --locked --bench sqlite_vs_boxdb --
          --boxdb-format yaml --rows 30 --samples 1 --reads 3 --batch-size 7 --writes 4 --typed

  client-types:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23.x'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
      - name: Install SQLite binding build dependency
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - run: just client-types-test

  performance:
    if: >-
      github.event_name == 'pull_request' ||
      github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        format: [binary, yaml]
        typed: [false, true]
    defaults:
      run:
        shell: bash
    env:
      BOXDB_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
      BOXDB_BENCH_FORMAT: ${{ matrix.format }}
      BOXDB_BENCH_TYPED: ${{ matrix.typed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install SQLite binding build dependency
        run: sudo apt-get update && sudo apt-get install --yes libclang-dev
      - name: Check out baseline revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.BOXDB_BASE_REVISION }}
          path: boxdb-baseline
          persist-credentials: false
      - name: Prepare base revision with the same benchmark harness
        run: |
          mv "$GITHUB_WORKSPACE/boxdb-baseline" "$RUNNER_TEMP/boxdb-baseline"
          cp -R benches/. "$RUNNER_TEMP/boxdb-baseline/benches/"
          mkdir -p target/performance
          git rev-parse HEAD > target/performance/current-revision.txt
          git rev-parse "$BOXDB_BASE_REVISION" > target/performance/base-revision.txt
      - name: Build both release benchmark executables before measuring
        run: |
          cargo bench --locked --bench sqlite_vs_boxdb --no-run
          cargo bench --locked --manifest-path "$RUNNER_TEMP/boxdb-baseline/Cargo.toml" \
            --bench sqlite_vs_boxdb --no-run
      - name: Measure base and current revisions on this runner
        run: |
          boxdb_typed_args=()
          if [[ "$BOXDB_BENCH_TYPED" == true ]]; then boxdb_typed_args=(--typed); fi
          for boxdb_revision in baseline current; do
            boxdb_manifest="$GITHUB_WORKSPACE/Cargo.toml"
            if [[ "$boxdb_revision" == baseline ]]; then
              boxdb_manifest="$RUNNER_TEMP/boxdb-baseline/Cargo.toml"
            fi
            cargo bench --locked --manifest-path "$boxdb_manifest" --bench sqlite_vs_boxdb -- \
              --boxdb-format "$BOXDB_BENCH_FORMAT" "${boxdb_typed_args[@]}" \
              --rows 1000 --samples 7 --reads 100 --read-repetitions 20 \
              --batch-size 100 --writes 20 --directory "$RUNNER_TEMP" \
              --json "$GITHUB_WORKSPACE/target/performance/$boxdb_revision.json"
          done
      - name: Reject performance regressions
        run: |
          python3 tools/check_performance.py target/performance/baseline.json \
            target/performance/current.json 2>&1 | tee target/performance/comparison.txt
      - name: Retain timings and revision IDs even when the check fails
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ matrix.format }}-typed-${{ matrix.typed }}
          path: target/performance/
          if-no-files-found: warn
