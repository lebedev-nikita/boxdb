[package]
name = "boxdb-node"
version = "0.3.2"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
boxdb = { path = "../../.." }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
